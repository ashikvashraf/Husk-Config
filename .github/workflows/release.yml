# Release builds for Android, macOS and Windows (iOS is intentionally not built).
#
# - Push a tag like v1.2.3 (or v1.3.0-beta.1)  -> build everything and publish a GitHub Release.
# - Run manually (Actions tab -> Release -> Run workflow) -> build everything, upload workflow artifacts only.
#
# See docs/RELEASING.md for the full process and the optional Android signing secrets.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a tag build half way through publishing; manual runs may supersede each other.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  FLUTTER_VERSION: "3.44.8"
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          pubspec_version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*$/\1/p' pubspec.yaml | head -n 1)"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$pubspec_version" && "${version%%-*}" != "$pubspec_version" ]]; then
              echo "::warning::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $pubspec_version. Building as $version anyway."
            fi
          else
            version="$pubspec_version"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$version' is not X.Y.Z or X.Y.Z-prerelease (tag must look like v1.2.3 or v1.2.3-beta.1)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Husk Config $version (build $BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  android:
    name: Android (APK + AAB)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      # "true" when built with the ANDROID_* signing secrets, "false" when debug-signed.
      signed: ${{ steps.keystore.outputs.signed }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install the NDK version Flutter pins
        shell: bash
        run: |
          set -euo pipefail
          # android/app uses ndkVersion = flutter.ndkVersion. The runner image may not ship that exact NDK;
          # Gradle would then download it silently mid-build. Installing it here makes it visible and fails early.
          flutter_root="$(cd "$(dirname "$(command -v flutter)")/.." && pwd)"
          ndk="$(grep -rhoE --include=FlutterExtension.kt 'ndkVersion[^"]*"[0-9]+\.[0-9]+\.[0-9]+"' \
            "$flutter_root/packages/flutter_tools/gradle" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
          if [[ -z "$ndk" ]]; then
            echo "::notice::Could not read Flutter's pinned NDK version; Gradle will install it during the build if needed."
          elif [[ -d "$ANDROID_HOME/ndk/$ndk" ]]; then
            echo "NDK $ndk is preinstalled."
          else
            echo "Installing NDK $ndk"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" | tail -n 5
          fi

      - name: Prepare release keystore
        id: keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            keystore="$RUNNER_TEMP/husk-config-release.jks"
            # Tolerate wrapped or CRLF base64 (e.g. GNU base64 without -w 0).
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$keystore"
            chmod 600 "$keystore"
            echo "path=$keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Android: release-signed with the ANDROID_* repository secrets." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Android build is debug-signed::ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are not all set, so the APK and AAB are signed with a throwaway debug key generated on this runner. Every such CI build has a different key, so no two debug-signed APKs can update each other (users must uninstall first and lose app data), and Google Play rejects the AAB. Set the four secrets before publishing Android builds to users. See docs/RELEASING.md."
            echo "Android: **debug-signed** with a throwaway key (signing secrets not configured). Users must uninstall previous versions first." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build APK and AAB
        shell: bash
        env:
          # Read by android/app/build.gradle.kts. Empty values mean "fall back to the debug key".
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build apk --release --build-name "$VERSION" --build-number "$BUILD_NUMBER"
          flutter build appbundle --release --build-name "$VERSION" --build-number "$BUILD_NUMBER"

      - name: Remove keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/husk-config-release.jks"

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Husk-Config-${VERSION}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/Husk-Config-${VERSION}-android.aab"
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: husk-config-android
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS (.app zip)
    needs: check
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # Pinned so a runner image default change cannot silently change the toolchain. Bump on purpose
      # (e.g. to Xcode 27 once a GA runner image has it).
      XCODE_VERSION: "26.6"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcode="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ -d "$xcode" ]]; then
            sudo xcode-select -s "$xcode/Contents/Developer"
          else
            echo "::warning::Xcode $XCODE_VERSION is not on this runner image; building with the image default. Update XCODE_VERSION in release.yml."
          fi
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Use CocoaPods for plugins
        shell: bash
        # flutter_inappwebview_macos 1.2.0-beta.3's Swift package declares macOS 10.14 and fails to compile
        # under Xcode 26.x (availability error in WebAuthenticationSession.swift). Through CocoaPods it is
        # compiled at the app's 12.0 deployment target (macos/Podfile post_install), which builds cleanly.
        # Local builds with Xcode 27 still use Swift Package Manager. Revisit when the plugin is fixed.
        run: flutter config --no-enable-swift-package-manager

      - name: Build macOS app
        shell: bash
        # CFBundleShortVersionString only allows digits and dots, so pre-release suffixes are dropped here
        # (1.3.0-beta.1 -> 1.3.0). The run-number build number (CFBundleVersion) still tells builds apart.
        run: flutter build macos --release --build-name "${VERSION%%-*}" --build-number "$BUILD_NUMBER"

      - name: Zip app bundle
        shell: bash
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/Husk Config.app"
          test -d "$app"
          # Ad-hoc signed (no Apple certificate). Informational only: report, but do not fail the build.
          codesign --verify --deep --strict --verbose=2 "$app" \
            || echo "::warning::codesign --verify reported problems with the ad-hoc signature of $app"
          mkdir -p dist
          # ditto keeps the bundle structure, framework symlinks and extended attributes intact.
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/Husk-Config-${VERSION}-macos.zip"
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: husk-config-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (x64 zip)
    needs: check
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # No effect with today's image (CMake 3.31; every CMakeLists here requires >= 3.14). It only guards against a
      # future CMake 4.x image rejecting plugins with cmake_minimum_required < 3.5. Review when the image changes.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Check NuGet
        shell: pwsh
        run: |
          # flutter_inappwebview_windows fetches WebView2 with nuget. Without it CMake only prints a NOTICE and the
          # build fails much later with a confusing error, so fail here instead.
          $nuget = Get-Command nuget -ErrorAction SilentlyContinue
          if (-not $nuget) { throw 'nuget.exe is not on PATH (needed by flutter_inappwebview_windows).' }
          Write-Output "nuget: $($nuget.Source)"

      - name: Build Windows app
        shell: pwsh
        run: flutter build windows --release --build-name "$env:VERSION" --build-number "$env:BUILD_NUMBER"

      - name: Package and check release folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "Husk-Config-$env:VERSION-windows-x64"
          $src = 'build\windows\x64\runner\Release'
          if (-not (Test-Path "$src\huskconfig.exe")) { throw "huskconfig.exe not found in $src" }
          $stage = "dist\$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "$src\*" -Destination $stage -Recurse
          $system32 = Join-Path $env:WINDIR 'System32'
          # Bundle the MSVC runtime next to the exe (Flutter's documented app-local deployment),
          # so the app starts on PCs without the Visual C++ Redistributable.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            $path = Join-Path $system32 $dll
            if (Test-Path $path) { Copy-Item $path $stage }
            else { Write-Output "::warning::$dll not found on the runner; users will need the Visual C++ Redistributable." }
          }

          # Make sure the folder runs on a clean PC: every DLL imported by the exe and the bundled DLLs must be in
          # the folder or be part of Windows. Missing MSVC runtime DLLs and WebView2Loader.dll are copied in.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found via vswhere.' }
          $vcRuntime = '^(msvcp140.*|vcruntime140.*|concrt140|vccorlib140|vcomp140)\.dll$'
          $webView2Loader = Get-ChildItem -Path 'build\windows\x64\packages' -Recurse -Filter 'WebView2Loader.dll' -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          $queue = [System.Collections.Generic.Queue[string]]::new()
          Get-ChildItem -Path $stage -File | Where-Object { $_.Extension -in '.exe', '.dll' } | ForEach-Object { $queue.Enqueue($_.FullName) }
          $missing = @()
          while ($queue.Count -gt 0) {
            $file = $queue.Dequeue()
            $leaf = Split-Path $file -Leaf
            $out = & $dumpbin /nologo /dependents $file
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $leaf" }
            $delay = $false
            foreach ($line in $out) {
              if ($line -match 'delay load dependencies') { $delay = $true; continue }
              if ($line -notmatch '^\s+(\S+\.dll)\s*$') { continue }
              $dep = $Matches[1]
              if ($dep -match '^(api|ext)-ms-') { continue } # API sets, resolved by Windows itself
              if (Test-Path (Join-Path $stage $dep)) { continue }
              $fromSystem = Join-Path $system32 $dep
              if ($dep -match $vcRuntime -and (Test-Path $fromSystem)) {
                Copy-Item $fromSystem $stage
                $queue.Enqueue((Join-Path (Resolve-Path $stage) $dep))
                Write-Output "Bundled $dep (imported by $leaf)"
                continue
              }
              if ($dep -ieq 'WebView2Loader.dll' -and $webView2Loader) {
                Copy-Item $webView2Loader.FullName $stage
                $queue.Enqueue((Join-Path (Resolve-Path $stage) $dep))
                Write-Output "Bundled $dep from $($webView2Loader.FullName) (imported by $leaf)"
                continue
              }
              if (Test-Path $fromSystem) { continue }
              if ($delay) { Write-Output "::warning::$leaf delay-loads $dep, which is neither bundled nor in System32." }
              else { $missing += "$dep (imported by $leaf)" }
            }
          }
          if ($missing.Count -gt 0) { throw "DLLs missing from the Windows zip: $($missing -join ', ')" }

          Compress-Archive -Path $stage -DestinationPath "dist\$name.zip" -CompressionLevel Optimal
          Remove-Item -Recurse -Force $stage
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: husk-config-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [check, android, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ github.ref_name }}
      ANDROID_SIGNED: ${{ needs.android.outputs.signed }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: husk-config-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          expected=(
            "Husk-Config-${VERSION}-android.apk"
            "Husk-Config-${VERSION}-android.aab"
            "Husk-Config-${VERSION}-macos.zip"
            "Husk-Config-${VERSION}-windows-x64.zip"
          )
          for f in "${expected[@]}"; do
            [[ -f "$f" ]] || { echo "::error::Missing artifact $f"; ls -l; exit 1; }
          done
          sha256sum "${expected[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail
          notes="$(cat <<'EOF'
          ## Install

          - **Android** (`*-android.apk`): allow installing apps from unknown sources for your browser or file manager, then open the APK. The `.aab` is for Google Play only.
          - **macOS** (`*-macos.zip`): unzip and move **Husk Config** to Applications. The app is not notarized, so macOS blocks the first launch. On macOS 15 or later, open it once, then go to **System Settings > Privacy & Security** and click **Open Anyway**. On macOS 12-14, right-click the app and choose **Open** instead. (Or in Terminal: `xattr -dr com.apple.quarantine "/Applications/Husk Config.app"`.) Allow **Local Network** access when asked (needed to reach phones on your LAN).
          - **Windows** (`*-windows-x64.zip`): unzip anywhere and run `huskconfig.exe`. Needs the Microsoft Edge WebView2 Runtime (preinstalled on Windows 11). The exe is unsigned, so SmartScreen may warn: choose **More info** > **Run anyway**.

          Verify downloads against `SHA256SUMS.txt`: on macOS/Linux run `shasum -a 256 -c SHA256SUMS.txt`; on Windows run `Get-FileHash .\Husk-Config-@VERSION@-windows-x64.zip -Algorithm SHA256` in PowerShell and compare the hash with the matching line.
          EOF
          )"
          notes="${notes//@VERSION@/$VERSION}"
          if [[ "$ANDROID_SIGNED" != "true" ]]; then
            notes+=$'\n\n'"> **Android builds in this release are debug-signed** with a throwaway key. Uninstall any previous Husk Config before installing this APK (this removes the app's data). The \`.aab\` cannot be uploaded to Google Play."
          fi
          is_prerelease=false
          if [[ "$TAG" == *-* ]]; then is_prerelease=true; fi
          assets=(dist/*)
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; replacing assets."
            gh release upload "$TAG" "${assets[@]}" --clobber
            # `gh release create` with assets creates a draft, uploads, then publishes. If an earlier attempt failed
            # mid-upload, the draft is still there: publish it now instead of leaving the release invisible.
            if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == "true" ]]; then
              echo "Release $TAG was still a draft; publishing it."
              gh release edit "$TAG" --draft=false --prerelease="$is_prerelease"
            fi
          else
            prerelease=()
            if [[ "$is_prerelease" == "true" ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag \
              --title "Husk Config $VERSION" \
              --generate-notes \
              --notes "$notes" \
              "${prerelease[@]}"
          fi
